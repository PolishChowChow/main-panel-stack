name: build-images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: ./main-panel-backend
          - name: web
            context: ./main-panel
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Check API URL
        if: matrix.name == 'web'
        env:
          API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "VITE_API_URL is EMPTY"; exit 1; fi
          echo "VITE_API_URL is set (${#API_URL} chars)"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ghcr.io/${{ env.OWNER }}/main-panel-${{ matrix.name }}:latest
            ghcr.io/${{ env.OWNER }}/main-panel-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-prod
    steps:
      - name: Diagnose connectivity
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          echo "host length: ${#SSH_HOST}, port: ${PORT:+set}"
          case "$SSH_HOST" in
            100.*) echo "host is in 100.x (Tailscale/CGNAT): not reachable from GitHub" ;;
            *[!0-9.]*) echo "host is a hostname" ;;
            *) echo "host is an IPv4 address" ;;
          esac
          echo "IPv4 records: $(getent ahostsv4 "$SSH_HOST" | wc -l)"
          echo "IPv6 records: $(getent ahostsv6 "$SSH_HOST" | wc -l)"
          nc -4 -z -w 10 "$SSH_HOST" "$PORT" && echo "TCP over IPv4: reachable" || echo "TCP over IPv4: NOT reachable"
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -6 -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 \
            -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" deploy